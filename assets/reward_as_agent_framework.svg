<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Reward as an Agent</title>
<desc id="desc">Current full Reward Agent profile. Separate task-blind observations and frozen requirements feed initial task, physics and visual assessment. Adaptive crops and CoTracker3 motion evidence support verification. WMReward then supplies physics evidence for reflection, followed by requirement scope auditing and scoring. Video-content uncertainty maps to zero under the current policy; eligibility and review reasons remain explicit. Execution and protocol faults are not valid training rewards.</desc>
