  <path d="M1431 564 C1360 564 1393 650 1310 650" class="optional-flow"/>
  <path d="M1288 889 H1355" fill="none" stroke="#7d9193" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M1355 889 C1390 889 1373 760 1430 760" class="flow"/>
