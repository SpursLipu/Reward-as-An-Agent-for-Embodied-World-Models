<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Reward as an Agent — planning, reward evaluation, and reflection</title>
  <desc id="desc">The Planning Module prepares task-blind video observations and frozen task requirements in separate branches. The Gated Multi-dimensional Reward Module jointly assesses task completion, physical plausibility, and visual quality. The Reflection Module rechecks relevant frames, audits requirement scope, and revises judgements. An optional, extensible external-tool group includes the integrated WMReward adapter and a dashed custom-tool extension slot requiring a new adapter. Tool feedback enters reflection. Fixed scoring rules, a review gate, and optional process checks produce a reward or a needs-review result.</desc>
  <defs>
    <style>
      text { font-family: 'Nimbus Sans', 'Liberation Sans', Arial, sans-serif; fill: #304449; }
      .section { font-size: 18px; font-weight: 600; fill: #748488; }
      .heading { font-size: 32px; font-weight: 500; }
      .subheading { font-size: 26px; font-weight: 500; }
      .body { font-size: 22px; fill: #596b6f; }
      .small { font-size: 19px; fill: #748488; }
      .icon { fill: none; stroke: #40575c; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #7d9193; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .optional-flow { fill: none; stroke: #7298a8; stroke-width: 2.5; stroke-dasharray: 7 8; stroke-linecap: round; marker-end: url(#optional-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#7d9193" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="optional-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1 L10 6 L2 11" fill="none" stroke="#7298a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1800" height="1040" fill="#fdfcf9"/>
  <text x="64" y="76" font-size="44" font-weight="500">Reward as an Agent</text>
  <text x="66" y="116" class="body">Planning → multi-dimensional reward evaluation → reflection</text>
  <path d="M1570 73 H1726" stroke="#cad6d1" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1740" cy="73" r="5" fill="#d9ae68"/>
  <text x="64" y="180" class="section">INPUTS</text>
  <text x="305" y="180" class="section">EVALUATION WORKFLOW</text>

  <!-- Module backgrounds precede connectors so arrows remain visible. -->
  <rect x="304" y="210" width="422" height="580" rx="26" fill="#fbf0dc" stroke="#d7c49e" stroke-width="1.5"/>
  <rect x="326" y="322" width="378" height="182" rx="18" fill="#fffdfa" stroke="#decfaf" stroke-width="1.3"/>
  <rect x="326" y="542" width="378" height="220" rx="18" fill="#fffdfa" stroke="#decfaf" stroke-width="1.3"/>
  <rect x="820" y="210" width="490" height="270" rx="26" fill="#e7f0e4" stroke="#b7cbb3" stroke-width="1.5"/>
  <rect x="820" y="544" width="490" height="215" rx="26" fill="#e9eef3" stroke="#bdcbd6" stroke-width="1.5"/>
  <rect x="1410" y="226" width="320" height="385" rx="24" fill="#e5f0f3" stroke="#b5cbd0" stroke-width="1.5"/>
  <rect x="842" y="823" width="446" height="138" rx="22" fill="#f5e8de" stroke="#d6c0ae" stroke-width="1.5"/>
  <rect x="1430" y="704" width="300" height="112" rx="20" fill="#edf3e8" stroke="#becfb5" stroke-width="1.5"/>
  <rect x="1430" y="833" width="300" height="112" rx="20" fill="#fbf0dc" stroke="#d7c49e" stroke-width="1.5"/>

  <!-- Separate video and task branches meet only at reward assessment. -->
  <path d="M238 398 H326" class="flow"/>
  <path d="M238 646 H326" class="flow"/>
  <path d="M704 398 C756 398 775 350 820 350" class="flow"/>
  <path d="M704 646 C787 646 756 413 820 413" class="flow"/>
  <path d="M1065 480 V544" class="flow"/>
