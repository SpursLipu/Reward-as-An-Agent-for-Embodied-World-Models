  <g transform="translate(65 279)">
    <rect x="18" y="0" width="150" height="102" rx="9" fill="#edf2ef" stroke="#afc0bf" stroke-width="1.6"/>
    <rect x="9" y="10" width="150" height="102" rx="9" fill="#e3edee" stroke="#8fa8aa" stroke-width="1.7"/>
    <rect x="0" y="20" width="150" height="102" rx="9" fill="#fbfdfd" stroke="#40575c" stroke-width="2.2"/>
    <path d="M17 101 H133" class="icon"/>
    <path d="M30 99 V84 L52 66 L46 49 L64 34" class="icon"/>
    <circle cx="52" cy="66" r="6" fill="#c9dfe4" stroke="#40575c" stroke-width="2"/>
    <circle cx="46" cy="49" r="5" fill="#c9dfe4" stroke="#40575c" stroke-width="2"/>
    <path d="M64 34 L77 43 M64 34 V50" class="icon"/>
    <path d="M91 74 L110 66 L128 75 L108 85Z" fill="#edcf96" stroke="#40575c" stroke-width="1.8"/>
    <path d="M91 74 V96 L108 105 L128 96 V75 M108 85 V105" class="icon"/>
    <path d="M132 34 H137 M132 47 H137 M132 60 H137" stroke="#9bb6ba" stroke-width="3"/>
  </g>
  <text x="64" y="447" class="subheading">Rollout video</text>
  <text x="64" y="479" class="small">What happened?</text>
  <g transform="translate(84 546)">
    <path d="M12 0 H105 L127 22 V124 Q127 134 117 134 H12 Q2 134 2 124 V10 Q2 0 12 0Z" fill="#fff4dd" stroke="#40575c" stroke-width="2.2"/>
    <path d="M105 0 V23 H127" class="icon"/>
    <path d="M25 42 H94 M25 66 H101 M25 90 H86 M25 114 H63" stroke="#829598" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M18 10 C11 -18 35 -18 35 8 V31 C35 45 23 45 23 31 V4" class="icon"/>
  </g>
  <text x="64" y="725" class="subheading">Task prompt</text>
  <text x="64" y="758" class="small">What was asked?</text>

  <!-- Planning means preparing evaluation criteria and observations. -->
  <text x="335" y="259" class="heading">Planning Module</text>
  <text x="335" y="293" font-size="21" fill="#7e725a">Task analysis &amp; evaluation setup</text>
  <g class="icon" transform="translate(349 343)">
    <path d="M0 16 Q18 -2 36 16 Q18 34 0 16Z" fill="#f0f6f7"/>
    <circle cx="18" cy="16" r="5" fill="#a7c8d0"/>
  </g>
  <text x="400" y="368" class="subheading">Video observation</text>
  <text x="348" y="403" font-size="21" fill="#596b6f">Visible actions &amp; state changes</text>
  <text x="348" y="434" class="small">Task text hidden</text>
  <g class="icon" stroke-width="1.7">
    <rect x="350" y="454" width="62" height="31" rx="4" fill="#edf4f5"/>
    <rect x="450" y="454" width="62" height="31" rx="4" fill="#edf4f5"/>
    <rect x="550" y="454" width="62" height="31" rx="4" fill="#edf4f5"/>
    <path d="M358 479 H404 M458 479 H504 M558 479 H604" stroke="#aebfc1"/>
    <rect x="368" y="467" width="11" height="11" fill="#e7c37e"/>
    <rect x="478" y="458" width="11" height="11" fill="#e7c37e"/>
    <rect x="588" y="467" width="11" height="11" fill="#e7c37e"/>
    <path d="M420 470 H441 M436 465 L441 470 L436 475 M520 470 H541 M536 465 L541 470 L536 475" stroke="#7d9193"/>
  </g>
  <text x="643" y="476" class="small">…</text>
  <g class="icon" transform="translate(349 564)">
    <rect width="27" height="35" rx="3" fill="#fff7e7"/>
    <path d="M7 10 H20 M7 18 H20 M7 26 H15"/>
    <path d="M21 27 L27 33 L37 20" stroke="#a88645"/>
  </g>
  <text x="400" y="592" class="subheading">Task requirements</text>
  <text x="348" y="628" font-size="21" fill="#596b6f">Extract and freeze the criteria</text>
  <g class="icon" stroke="#a2864f">
    <path d="M351 657 L358 664 L369 651"/>
    <path d="M351 692 L358 699 L369 686"/>
    <path d="M351 727 L358 734 L369 721"/>
  </g>
  <text x="390" y="665" font-size="22">Requested action</text>
  <text x="390" y="700" font-size="22">Target object</text>
  <text x="390" y="735" font-size="22">Required end state</text>

  <!-- All three reward dimensions are assessed together. -->
  <text x="854" y="255" class="heading">Gated Multi-dimensional</text>
  <text x="854" y="295" class="heading">Reward Module</text>
  <path d="M855 311 H1070" stroke="#b7cbb3" stroke-width="4" stroke-linecap="round"/>
  <g class="icon">
    <path d="M908 341 V384 M909 341 Q924 332 939 341 V365 Q924 356 909 365" fill="#edcf97"/>
    <path d="M1045 377 H1083 M1053 372 V357 H1075 V372 M1064 335 V353 M1058 347 L1064 353 L1070 347" fill="#d5e6ef"/>
    <path d="M1190 360 Q1210 339 1230 360 Q1210 381 1190 360Z" fill="#f6faf0"/>
    <circle cx="1210" cy="360" r="6" fill="#c6dbb6"/>
  </g>
  <text x="923" y="412" text-anchor="middle" font-size="24">Task</text>
  <text x="923" y="443" text-anchor="middle" class="small">Completion</text>
  <text x="1065" y="412" text-anchor="middle" font-size="24">Physics</text>
  <text x="1065" y="443" text-anchor="middle" class="small">Plausibility</text>
  <text x="1210" y="412" text-anchor="middle" font-size="24">Visual</text>
  <text x="1210" y="443" text-anchor="middle" class="small">Quality</text>

  <!-- Reflection is a bounded recheck before scoring. -->
  <g class="icon" transform="translate(850 565)">
    <circle cx="20" cy="19" r="18" fill="#f6f8fb"/>
    <path d="M34 33 L48 47"/>
    <path d="M12 19 L18 25 L29 12" stroke="#7b93a4"/>
  </g>
  <text x="918" y="593" class="heading">Reflection Module</text>
  <text x="854" y="638" class="body">Recheck relevant video frames</text>
  <text x="854" y="676" class="body">Audit task requirements and scope</text>
  <text x="854" y="714" class="body">Revise inconsistent judgements</text>

  <!-- Solid: integrated adapter. Dashed: a future adapter extension. -->
  <text x="1439" y="263" class="section">OPTIONAL · EXTENSIBLE</text>
  <text x="1439" y="305" class="heading">External Tools</text>
  <rect x="1450" y="326" width="258" height="91" rx="14" fill="#fbfdfd" stroke="#adc6cf" stroke-width="1.4"/>
  <g class="icon" transform="translate(1466 346)">
    <path d="M1 39 H39 M1 39 V0" stroke="#9bb6bf"/>
    <path d="M5 27 L12 25 L18 9 L25 31 L31 18 L39 15" stroke="#6f9cad"/>
  </g>
  <text x="1517" y="362" font-size="25">WMReward</text>
  <text x="1517" y="390" font-size="18" fill="#748488">Physics · integrated</text>

  <rect x="1450" y="440" width="258" height="91" rx="14" fill="#f3f8fa" stroke="#99b6c2" stroke-width="1.5" stroke-dasharray="6 6"/>
  <g class="icon" stroke="#7899a6">
    <circle cx="1486" cy="484" r="17"/>
    <path d="M1478 484 H1494 M1486 476 V492"/>
  </g>
  <text x="1517" y="478" font-size="24">Custom tools</text>
  <text x="1517" y="506" font-size="18" fill="#748488">Adapter required</text>

  <!-- Explicit adapters share the feedback path into reflection. -->
  <path d="M1450 371 H1431 V564 M1450 485 H1431" fill="none" stroke="#92adb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1431" cy="371" r="3" fill="#92adb6"/>
  <circle cx="1431" cy="485" r="3" fill="#92adb6"/>
  <text x="1450" y="577" class="small">Structured tool feedback</text>

  <!-- Fixed aggregation follows the refined assessments. -->
  <g class="icon" transform="translate(867 850)">
    <path d="M0 30 H56 M28 6 V70 M11 70 H45"/>
    <path d="M4 30 L-5 51 H15Z M52 30 L43 51 H63Z" fill="#efd090"/>
    <path d="M-5 51 Q5 63 15 51 M43 51 Q53 63 63 51" fill="#fffaf0"/>
    <circle cx="28" cy="17" r="5" fill="#e2bd78"/>
  </g>
  <text x="952" y="866" font-size="29">Reward aggregation</text>
  <text x="952" y="903" class="body">Fixed scoring + review gate</text>
  <text x="952" y="935" class="small">Optional process checks</text>

  <!-- Final outcomes -->
  <text x="1430" y="666" class="section">OUTPUT</text>
  <g class="icon" transform="translate(1451 731)">
    <circle cx="24" cy="24" r="23" fill="#dae9d1" stroke="#789470"/>
    <path d="M13 24 L21 32 L37 14" stroke="#6f8967"/>
  </g>
  <text x="1516" y="749" class="subheading">Reward</text>
  <text x="1516" y="785" class="body">score + report</text>
  <g class="icon" transform="translate(1451 861)">
    <path d="M3 1 H43 Q48 1 48 6 V31 Q48 36 43 36 H20 L8 47 V36 H3 Q-2 36 -2 31 V6 Q-2 1 3 1Z" fill="#f2ddb3" stroke="#a98b50"/>
    <circle cx="11" cy="18" r="1.5" fill="#a98b50"/>
    <circle cx="23" cy="18" r="1.5" fill="#a98b50"/>
    <circle cx="35" cy="18" r="1.5" fill="#a98b50"/>
  </g>
  <text x="1516" y="877" class="subheading">Needs review</text>
  <text x="1516" y="913" class="body">score = null</text>

  <path d="M335 886 H545" stroke="#d5ddd9" stroke-width="2" stroke-linecap="round"/>
  <text x="335" y="921" class="small">Every judgement links back</text>
  <text x="335" y="948" class="small">to the source video frames.</text>
</svg>
